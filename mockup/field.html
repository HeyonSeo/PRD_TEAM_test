<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>현장 하자 등록</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body class="field">
<div class="privacy-note" id="privacy-note" role="note"><span aria-hidden="true">🔒</span> 가짜 데이터 · 외부로 전송되지 않음 <span class="privacy-more">(이 기기 안에만 저장)</span></div>
<header class="topbar">
  <h1>현장 하자 등록</h1>
  <span class="sub" id="complex-label"></span>
</header>
<main class="wrap narrow" id="app">

  <!-- 위쪽 탭: 등록 / 접수 목록 -->
  <nav class="tabs" id="tabs" aria-label="화면 바꾸기" hidden>
    <button type="button" class="btn tab" id="tab-register" data-view="register">새로 등록</button>
    <button type="button" class="btn tab" id="tab-list" data-view="list">접수 목록 <span class="tab-count" id="tab-count"></span></button>
  </nav>

  <!-- 처음 한 번: 우리 단지 고르기 -->
  <section id="view-pick" class="view" hidden>
    <div class="card">
      <h2>우리 단지를 골라 주세요</h2>
      <p class="muted">처음 한 번만 고르면 다음부터는 바로 등록 화면이 열립니다.</p>
      <div class="pick-list" id="complex-list"></div>
    </div>
  </section>

  <!-- 등록 화면: 사진, 동·호수, 한 줄 -->
  <section id="view-register" class="view" hidden>
    <form id="reg-form" autocomplete="off" novalidate>
      <div class="card step">
        <h2><span class="step-no">1</span> 사진</h2>
        <label class="btn primary block photo-btn" for="photo-input">사진 고르기 (여러 장 한 번에)</label>
        <input type="file" id="photo-input" accept="image/*" multiple class="visually-hidden">
        <p class="muted small-note" id="photo-note">아직 고른 사진이 없습니다.</p>
        <div class="thumbs" id="thumbs"></div>
      </div>

      <div class="card step">
        <h2><span class="step-no">2</span> 동·호수</h2>
        <div class="choice-row" id="dong-list" role="group" aria-label="동 선택"></div>
        <div class="ho-grid" id="ho-list" role="group" aria-label="호 선택"></div>
        <div class="resident" id="resident" hidden></div>
      </div>

      <div class="card step">
        <h2><span class="step-no">3</span> 한 줄 내용</h2>
        <input type="text" id="text-input" class="text-input" maxlength="60" placeholder="예: 욕실 천장에서 물이 샘" aria-label="한 줄 내용">
        <div class="chips" id="chips" aria-label="자주 쓰는 말"></div>
      </div>

      <p class="missing" id="missing"></p>
      <button type="submit" class="btn primary block big" id="submit-btn" disabled>등록하기</button>
    </form>
  </section>

  <!-- 완료 화면 -->
  <section id="view-done" class="view" hidden>
    <div class="card done">
      <div class="done-mark" aria-hidden="true">✓</div>
      <h2 id="done-title">등록 완료</h2>
      <p id="done-detail"></p>
      <p class="muted">본부 화면에도 바로 올라갔습니다. 사무실에서 다시 입력하지 않아도 됩니다.</p>
      <button type="button" class="btn primary block big" id="again-btn">한 건 더 등록</button>
      <button type="button" class="btn block" id="to-list-btn">접수 목록 보기</button>
    </div>
  </section>

  <!-- 우리 단지 접수 목록: 입주민 전화가 오면 동·호수로 바로 찾기 -->
  <section id="view-list" class="view" hidden>
    <div class="card search-card">
      <label for="search-input" class="search-label">동·호수로 찾기</label>
      <input type="search" id="search-input" class="text-input" inputmode="numeric" autocomplete="off" placeholder="예: 101 1203">
      <div class="status-filter" id="status-filter" role="group" aria-label="상태로 보기"></div>
      <p class="muted small-note" id="list-note"></p>
    </div>
    <ol class="report-list" id="report-list"></ol>
  </section>

  <p class="center"><button type="button" class="btn linkish" id="change-complex" hidden>단지 바꾸기</button></p>
</main>
<script src="assets/data.js"></script>
<script src="assets/store.js"></script>
<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var MAX_SIDE = 480;
  var CHIPS = ['물이 샘', '곰팡이', '방충망 찢어짐', '문이 안 닫힘', '전등 안 켜짐', '보일러 고장'];

  var state = { complexId: null, photos: [], dong: null, ho: null, startedAt: 0, busy: 0 };

  function show(name) {
    ['pick', 'register', 'done', 'list'].forEach(function (v) { $('view-' + v).hidden = v !== name; });
    $('change-complex').hidden = name === 'pick';
    $('tabs').hidden = name === 'pick';
    var active = name === 'list' ? 'list' : 'register';
    ['register', 'list'].forEach(function (t) {
      var b = $('tab-' + t);
      b.classList.toggle('on', t === active);
      b.setAttribute('aria-current', t === active ? 'page' : 'false');
    });
    if (state.complexId) updateTabCount();
    window.scrollTo(0, 0);
  }

  // ---------- 단지 고르기 ----------
  function renderPick() {
    var box = $('complex-list');
    box.innerHTML = '';
    LH_DATA.complexes.forEach(function (c) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'btn block';
      b.textContent = c.name;
      b.dataset.complex = c.id;
      b.addEventListener('click', function () {
        Store.setMyComplex(c.id);
        start(c.id);
      });
      box.appendChild(b);
    });
    $('complex-label').textContent = '';
    show('pick');
  }

  function start(complexId) {
    var c = LH_DATA.findComplex(complexId);
    if (!c) { renderPick(); return; }
    state.complexId = c.id;
    $('complex-label').textContent = c.name;
    openRegister();
  }

  // ---------- 등록 화면 ----------
  function openRegister() {
    state.photos = [];
    state.dong = null;
    state.ho = null;
    state.busy = 0;
    $('photo-input').value = '';
    $('text-input').value = '';
    renderThumbs();
    renderDongs();
    renderHos();
    renderResident();
    updateSubmit();
    show('register');
    state.startedAt = Date.now(); // 등록 화면을 연 순간부터 잰다
  }

  function renderThumbs() {
    var box = $('thumbs');
    box.innerHTML = '';
    state.photos.forEach(function (src, i) {
      var wrap = document.createElement('div');
      wrap.className = 'thumb';
      var img = document.createElement('img');
      img.src = src;
      img.alt = '고른 사진 ' + (i + 1);
      var del = document.createElement('button');
      del.type = 'button';
      del.className = 'thumb-del';
      del.setAttribute('aria-label', '사진 ' + (i + 1) + ' 빼기');
      del.textContent = '×';
      del.addEventListener('click', function () {
        state.photos.splice(i, 1);
        renderThumbs();
        updateSubmit();
      });
      wrap.appendChild(img);
      wrap.appendChild(del);
      box.appendChild(wrap);
    });
    $('photo-note').textContent = state.busy ? '사진을 줄이는 중…' :
      (state.photos.length ? '사진 ' + state.photos.length + '장' : '아직 고른 사진이 없습니다.');
  }

  // 긴 변 480px 이하 JPEG로 줄이기
  function shrink(file) {
    return new Promise(function (resolve) {
      var url;
      try { url = URL.createObjectURL(file); } catch (e) { resolve(null); return; }
      var img = new Image();
      img.onload = function () {
        var w = img.naturalWidth, h = img.naturalHeight;
        var scale = Math.min(1, MAX_SIDE / Math.max(w, h));
        var cw = Math.max(1, Math.round(w * scale)), ch = Math.max(1, Math.round(h * scale));
        var cv = document.createElement('canvas');
        cv.width = cw; cv.height = ch;
        var ctx = cv.getContext('2d');
        ctx.fillStyle = '#fff';
        ctx.fillRect(0, 0, cw, ch);
        ctx.drawImage(img, 0, 0, cw, ch);
        URL.revokeObjectURL(url);
        resolve(cv.toDataURL('image/jpeg', 0.72));
      };
      img.onerror = function () { URL.revokeObjectURL(url); resolve(null); };
      img.src = url;
    });
  }

  $('photo-input').addEventListener('change', function (e) {
    var files = Array.prototype.slice.call(e.target.files || []).filter(function (f) { return /^image\//.test(f.type); });
    if (!files.length) return;
    state.busy++;
    renderThumbs();
    updateSubmit();
    Promise.all(files.map(shrink)).then(function (urls) {
      urls.forEach(function (u) { if (u) state.photos.push(u); });
      state.busy--;
      e.target.value = '';
      renderThumbs();
      updateSubmit();
    });
  });

  function complex() { return LH_DATA.findComplex(state.complexId); }

  function renderDongs() {
    var box = $('dong-list');
    box.innerHTML = '';
    complex().dongs.forEach(function (d) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'btn choice' + (state.dong === d.dong ? ' on' : '');
      b.textContent = d.dong + '동';
      b.dataset.dong = d.dong;
      b.setAttribute('aria-pressed', state.dong === d.dong ? 'true' : 'false');
      b.addEventListener('click', function () {
        state.dong = d.dong;
        state.ho = null;
        renderDongs();
        renderHos();
        renderResident();
        updateSubmit();
      });
      box.appendChild(b);
    });
  }

  function renderHos() {
    var box = $('ho-list');
    box.innerHTML = '';
    if (!state.dong) {
      box.innerHTML = '<p class="muted">동을 먼저 누르면 호수가 나옵니다.</p>';
      return;
    }
    var dong = complex().dongs.filter(function (d) { return d.dong === state.dong; })[0];
    var perFloor = 0;
    dong.units.forEach(function (u) { if (Math.floor(+u.ho / 100) === 1) perFloor++; });
    box.style.gridTemplateColumns = 'repeat(' + Math.max(2, perFloor) + ', 1fr)';
    dong.units.forEach(function (u) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'btn choice' + (state.ho === u.ho ? ' on' : '');
      b.textContent = u.ho + '호';
      b.dataset.ho = u.ho;
      b.setAttribute('aria-pressed', state.ho === u.ho ? 'true' : 'false');
      b.addEventListener('click', function () {
        state.ho = u.ho;
        renderHos();
        renderResident();
        updateSubmit();
      });
      box.appendChild(b);
    });
  }

  // 동·호수를 고르면 입주민 연락처가 자동으로 붙음(화면에는 가려서 표시)
  function renderResident() {
    var el = $('resident');
    if (!state.dong || !state.ho) { el.hidden = true; el.textContent = ''; return; }
    var r = LH_DATA.findResident(state.complexId, state.dong, state.ho);
    el.hidden = false;
    el.innerHTML = '';
    var t = document.createElement('strong');
    t.textContent = state.dong + '동 ' + state.ho + '호';
    var d = document.createElement('span');
    d.textContent = r ? ' · 입주민 ' + LH_DATA.maskName(r.name) + ' · ' : ' · 입주민 정보 없음';
    if (r) {
      var ph = document.createElement('span');
      ph.className = 'nowrap';
      ph.textContent = LH_DATA.maskPhone(r.phone);
      d.appendChild(ph);
    }
    var n = document.createElement('div');
    n.className = 'muted small-note';
    n.textContent = '연락처는 자동으로 붙습니다.';
    el.appendChild(t); el.appendChild(d); el.appendChild(n);
  }

  CHIPS.forEach(function (c) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'btn chip';
    b.textContent = c;
    b.addEventListener('click', function () {
      var input = $('text-input');
      input.value = input.value.trim() ? input.value.trim() + ', ' + c : c;
      updateSubmit();
    });
    $('chips').appendChild(b);
  });
  $('text-input').addEventListener('input', updateSubmit);

  function missingParts() {
    var m = [];
    if (!state.photos.length) m.push('사진');
    if (!state.dong || !state.ho) m.push('동·호수');
    if (!$('text-input').value.trim()) m.push('한 줄 내용');
    return m;
  }

  function updateSubmit() {
    var m = missingParts();
    var ready = !m.length && !state.busy;
    $('submit-btn').disabled = !ready;
    $('missing').textContent = state.busy ? '사진을 줄이는 중입니다…' :
      (ready ? '준비됐습니다. 등록하기를 누르세요.' : '남은 것: ' + m.join(', '));
  }

  function formatElapsed(sec) {
    if (sec < 60) return String(sec).padStart(2, '0') + '초';
    return Math.floor(sec / 60) + '분 ' + String(sec % 60).padStart(2, '0') + '초';
  }

  $('reg-form').addEventListener('submit', function (e) {
    e.preventDefault();
    if (missingParts().length || state.busy) return;
    var item = Store.add({
      complexId: state.complexId,
      dong: state.dong,
      ho: state.ho,
      text: $('text-input').value.trim(),
      photos: state.photos.slice()
    });
    var sec = Math.max(0, Math.round((Date.now() - state.startedAt) / 1000));
    $('done-title').textContent = '등록 완료 · ' + formatElapsed(sec);
    $('done-detail').textContent = item.dong + '동 ' + item.ho + '호 · ' + item.text + ' · 사진 ' + item.photos.length + '장';
    show('done');
  });

  $('again-btn').addEventListener('click', openRegister);
  $('to-list-btn').addEventListener('click', openList);
  $('change-complex').addEventListener('click', renderPick);
  $('tab-register').addEventListener('click', function () {
    if ($('view-register').hidden) openRegister();
  });
  $('tab-list').addEventListener('click', openList);

  // ---------- 우리 단지 접수 목록 ----------
  var STATUSES = LH_DATA.statuses; // 접수 → 업체 배정 → 보수 완료
  var listFilter = '전체';

  function myReports() {
    return Store.list().filter(function (r) { return r.complexId === state.complexId; });
  }

  function updateTabCount() {
    var open = myReports().filter(function (r) { return r.status !== '보수 완료'; }).length;
    $('tab-count').textContent = open ? '(진행 ' + open + ')' : '';
  }

  // "101 1203", "101동 1203호", "101-1203", "1203" 모두 찾기. 숫자 둘이면 앞은 동, 뒤는 호
  function matches(r, query) {
    var tokens = query.match(/\d+/g);
    if (!tokens) return true;
    if (tokens.length === 1 && tokens[0].length >= 6) {
      // "1011203"처럼 붙여 쓴 경우
      return (r.dong + r.ho).indexOf(tokens[0]) >= 0;
    }
    if (tokens.length >= 2) return r.dong.indexOf(tokens[0]) === 0 && r.ho.indexOf(tokens[1]) === 0;
    return r.dong.indexOf(tokens[0]) === 0 || r.ho.indexOf(tokens[0]) === 0;
  }

  function daysText(n) { return n === 0 ? '오늘' : n + '일째'; }

  function fmtDate(ts) {
    var d = new Date(ts);
    return (d.getMonth() + 1) + '월 ' + d.getDate() + '일';
  }

  function renderFilter(all) {
    var box = $('status-filter');
    box.innerHTML = '';
    ['전체'].concat(STATUSES).forEach(function (st) {
      var n = st === '전체' ? all.length : all.filter(function (r) { return r.status === st; }).length;
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'btn choice small' + (listFilter === st ? ' on' : '');
      b.dataset.filter = st;
      b.setAttribute('aria-pressed', listFilter === st ? 'true' : 'false');
      b.textContent = st + ' ' + n;
      b.addEventListener('click', function () { listFilter = st; renderList(); });
      box.appendChild(b);
    });
  }

  function stepsEl(status) {
    var ol = document.createElement('div');
    ol.className = 'status-steps';
    ol.setAttribute('aria-label', '처리 단계: ' + status);
    var idx = STATUSES.indexOf(status);
    STATUSES.forEach(function (st, i) {
      if (i > 0) {
        var a = document.createElement('span');
        a.className = 'stp-arrow'; a.setAttribute('aria-hidden', 'true'); a.textContent = '›';
        ol.appendChild(a);
      }
      var s = document.createElement('span');
      s.className = 'stp' + (i < idx ? ' past' : '') + (i === idx ? ' now' : '');
      s.textContent = st;
      ol.appendChild(s);
    });
    return ol;
  }

  function renderList() {
    var all = myReports();
    var query = $('search-input').value.trim();
    renderFilter(all);
    var shown = all.filter(function (r) {
      return matches(r, query) && (listFilter === '전체' || r.status === listFilter);
    });
    var box = $('report-list');
    box.innerHTML = '';
    var now = Date.now();
    $('list-note').textContent = query
      ? '"' + query + '" 찾은 결과 ' + shown.length + '건'
      : '우리 단지 접수 ' + all.length + '건 · 최근 순';
    if (!shown.length) {
      var empty = document.createElement('li');
      empty.className = 'card empty';
      empty.textContent = query ? '이 동·호수로 들어온 접수가 없습니다.' : '해당하는 접수가 없습니다.';
      box.appendChild(empty);
      return;
    }
    shown.forEach(function (r) {
      var li = document.createElement('li');
      li.className = 'card report';
      li.dataset.id = r.id;

      var head = document.createElement('div');
      head.className = 'report-head';
      var unit = document.createElement('strong');
      unit.className = 'report-unit';
      unit.textContent = r.dong + '동 ' + r.ho + '호';
      var badge = document.createElement('span');
      badge.className = 'badge s-' + r.status.replace(/ /g, '-');
      badge.textContent = r.status;
      head.appendChild(unit); head.appendChild(badge);

      var text = document.createElement('p');
      text.className = 'report-text';
      text.textContent = r.text;

      var meta = document.createElement('p');
      meta.className = 'report-meta';
      var days = Store.daysSince(r.statusAt || r.createdAt, now);
      var stale = r.status !== '보수 완료' && days >= 7;
      meta.textContent = fmtDate(r.createdAt) + ' 접수 · ' +
        (r.status === '보수 완료' ? '보수 완료 ' + fmtDate(r.statusAt) : r.status + ' ' + daysText(days));
      if (stale) meta.classList.add('stale');
      meta.dataset.days = days;

      var res = LH_DATA.findResident(r.complexId, r.dong, r.ho);
      var who = document.createElement('p');
      who.className = 'report-who muted';
      who.textContent = res ? '입주민 ' + LH_DATA.maskName(res.name) + ' · ' + LH_DATA.maskPhone(res.phone) : '';

      var pics = document.createElement('div');
      pics.className = 'report-pics';
      (r.photos || []).slice(0, 4).forEach(function (src, i) {
        var img = document.createElement('img');
        img.src = src;
        img.alt = r.dong + '동 ' + r.ho + '호 사진 ' + (i + 1);
        pics.appendChild(img);
      });

      li.appendChild(head);
      li.appendChild(text);
      li.appendChild(stepsEl(r.status));
      li.appendChild(meta);
      if (who.textContent) li.appendChild(who);
      if (pics.childNodes.length) li.appendChild(pics);

      var next = STATUSES[STATUSES.indexOf(r.status) + 1];
      if (next) {
        var b = document.createElement('button');
        b.type = 'button';
        b.className = 'btn primary block next-btn';
        b.dataset.next = next;
        b.textContent = { '업체 배정': '업체 배정으로 바꾸기', '보수 완료': '보수 완료로 바꾸기' }[next] || next;
        b.addEventListener('click', function () {
          Store.setStatus(r.id, next);
          renderList();
          updateTabCount();
          var again = document.querySelector('.report[data-id="' + r.id + '"]');
          if (again) {
            again.classList.add('just-changed');
            var f = again.querySelector('.next-btn') || again;
            if (f.focus) try { f.focus({ preventScroll: true }); } catch (e) { /* 무시 */ }
          }
        });
        li.appendChild(b);
      } else {
        var done = document.createElement('p');
        done.className = 'report-done';
        done.textContent = '✓ 처리 끝';
        li.appendChild(done);
      }
      box.appendChild(li);
    });
  }

  function openList() {
    renderList();
    show('list');
  }

  $('search-input').addEventListener('input', renderList);

  // 다른 탭(본부 화면 등)에서 바뀌면 목록도 새로 그림
  Store.onChange(function () {
    if (!state.complexId) return;
    updateTabCount();
    if (!$('view-list').hidden) renderList();
  });

  var saved = Store.getMyComplex();
  if (saved && LH_DATA.findComplex(saved)) start(saved); else renderPick();
})();
</script>
</body>
</html>

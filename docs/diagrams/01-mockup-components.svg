<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker>
  </defs>
  <rect width="960" height="560" fill="#ffffff"/>
  <text x="32" y="40" font-size="20" font-weight="700" fill="#0f172a">시안 구성도: 브라우저 하나 안에서 끝나는 구조</text>
  <text x="32" y="64" font-size="14" fill="#475569">서버 없음 · 외부 요청 없음 · 모든 데이터는 가짜</text>

  <!-- browser boundary -->
  <rect x="32" y="88" width="696" height="440" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="52" y="114" font-size="14" font-weight="700" fill="#334155">브라우저 (크롬·엣지) · 같은 출처</text>

  <!-- pages -->
  <rect x="56" y="132" width="200" height="110" rx="10" fill="#dbeafe" stroke="#1d4ed8"/>
  <text x="156" y="160" text-anchor="middle" font-size="16" font-weight="700" fill="#1e3a8a">field.html</text>
  <text x="156" y="184" text-anchor="middle" font-size="13" fill="#1e3a8a">현장 화면 · 폰 375px</text>
  <text x="156" y="206" text-anchor="middle" font-size="12" fill="#334155">단지 기억 · 등록 · 접수 목록</text>
  <text x="156" y="226" text-anchor="middle" font-size="12" fill="#334155">관리사무소 과장</text>

  <rect x="280" y="132" width="200" height="110" rx="10" fill="#dcfce7" stroke="#15803d"/>
  <text x="380" y="160" text-anchor="middle" font-size="16" font-weight="700" fill="#14532d">hq.html</text>
  <text x="380" y="184" text-anchor="middle" font-size="13" fill="#14532d">본부 화면 · PC 1280px</text>
  <text x="380" y="206" text-anchor="middle" font-size="12" fill="#334155">단지 12곳 카드 · 취합 표</text>
  <text x="380" y="226" text-anchor="middle" font-size="12" fill="#334155">본부 담당자</text>

  <rect x="504" y="132" width="200" height="110" rx="10" fill="#fef9c3" stroke="#a16207"/>
  <text x="604" y="160" text-anchor="middle" font-size="16" font-weight="700" fill="#713f12">index.html</text>
  <text x="604" y="184" text-anchor="middle" font-size="13" fill="#713f12">시연 시작 화면</text>
  <text x="604" y="206" text-anchor="middle" font-size="12" fill="#334155">문제·비교표 · 초기화</text>
  <text x="604" y="226" text-anchor="middle" font-size="12" fill="#334155">시연자(본인)</text>

  <!-- arrows pages -> store -->
  <line x1="156" y1="242" x2="300" y2="300" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="380" y1="242" x2="380" y2="300" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="604" y1="242" x2="460" y2="300" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- store -->
  <rect x="200" y="302" width="360" height="86" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="380" y="328" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">assets/store.js · window.Store</text>
  <text x="380" y="352" text-anchor="middle" font-size="12" fill="#334155">list · add · setStatus · reset</text>
  <text x="380" y="372" text-anchor="middle" font-size="12" fill="#334155">getMyComplex · setMyComplex · onChange · daysSince</text>

  <!-- data -->
  <rect x="56" y="420" width="250" height="86" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="181" y="446" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">assets/data.js · LH_DATA</text>
  <text x="181" y="470" text-anchor="middle" font-size="12" fill="#334155">가상 단지 12곳 · 동·호 · 가짜 입주민</text>
  <text x="181" y="490" text-anchor="middle" font-size="12" fill="#334155">시드 40건 · maskName · maskPhone</text>
  <line x1="250" y1="388" x2="205" y2="418" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="168" y="404" font-size="12" fill="#475569">시드·조회</text>

  <!-- localStorage -->
  <rect x="440" y="420" width="264" height="86" rx="10" fill="#ede9fe" stroke="#6d28d9"/>
  <text x="572" y="446" text-anchor="middle" font-size="16" font-weight="700" fill="#4c1d95">localStorage</text>
  <text x="572" y="470" text-anchor="middle" font-size="12" fill="#334155">lh-defect-reports-v1 (접수 목록)</text>
  <text x="572" y="490" text-anchor="middle" font-size="12" fill="#334155">lh-defect-my-complex-v1 (우리 단지)</text>
  <line x1="510" y1="388" x2="545" y2="418" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="532" y="404" font-size="12" fill="#475569">읽기·쓰기</text>

  <!-- storage event loop -->
  <path d="M704,463 H756 V122 H380 V128" fill="none" stroke="#c2410c" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#b)"/>
  <text x="770" y="300" font-size="12" font-weight="700" fill="#c2410c" text-anchor="middle" transform="rotate(90 770 300)">storage 이벤트 → 다른 탭 즉시 갱신</text>

  <!-- outside -->
  <rect x="790" y="132" width="148" height="374" rx="12" fill="#fef2f2" stroke="#b91c1c" stroke-dasharray="4 4"/>
  <text x="858" y="164" text-anchor="middle" font-size="15" font-weight="700" fill="#991b1b">브라우저 밖</text>
  <text x="858" y="200" text-anchor="middle" font-size="13" fill="#7f1d1d">서버 없음</text>
  <text x="858" y="226" text-anchor="middle" font-size="13" fill="#7f1d1d">외부 CDN 없음</text>
  <text x="858" y="252" text-anchor="middle" font-size="13" fill="#7f1d1d">외부 글꼴 없음</text>
  <text x="858" y="278" text-anchor="middle" font-size="13" fill="#7f1d1d">카톡·메일 없음</text>
  <line x1="806" y1="310" x2="910" y2="414" stroke="#b91c1c" stroke-width="3"/>
  <line x1="910" y1="310" x2="806" y2="414" stroke="#b91c1c" stroke-width="3"/>
  <text x="858" y="450" text-anchor="middle" font-size="12" fill="#7f1d1d">check.js가</text>
  <text x="858" y="468" text-anchor="middle" font-size="12" fill="#7f1d1d">외부 요청 0건을</text>
  <text x="858" y="486" text-anchor="middle" font-size="12" fill="#7f1d1d">매번 검사</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
  </defs>
  <rect width="960" height="470" fill="#ffffff"/>
  <text x="32" y="40" font-size="20" font-weight="700" fill="#0f172a">데이터 모델과 처리 상태</text>

  <!-- Complex -->
  <rect x="32" y="64" width="250" height="160" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <rect x="32" y="64" width="250" height="34" rx="10" fill="#f1f5f9"/>
  <text x="48" y="87" font-size="15" font-weight="700" fill="#0f172a">단지 (LH_DATA.complexes)</text>
  <g font-size="13" fill="#334155" font-family="ui-monospace,Menlo,Consolas,monospace">
    <text x="48" y="122">id, name</text>
    <text x="48" y="146">dongs[]: {dong, units[]}</text>
    <text x="48" y="170">units[]: {ho, resident}</text>
    <text x="48" y="194">findResident(단지,동,호)</text>
  </g>
  <text x="48" y="214" font-size="11" fill="#64748b">12곳 · 가상 이름 · 고정 시드 난수</text>

  <!-- Resident -->
  <rect x="32" y="270" width="250" height="132" rx="10" fill="#ffffff" stroke="#b91c1c" stroke-width="1.5"/>
  <rect x="32" y="270" width="250" height="34" rx="10" fill="#fef2f2"/>
  <text x="48" y="293" font-size="15" font-weight="700" fill="#991b1b">입주민 (가짜 · 민감)</text>
  <g font-size="13" fill="#334155" font-family="ui-monospace,Menlo,Consolas,monospace">
    <text x="48" y="328">name  → 화면: 김○○</text>
    <text x="48" y="352">phone → 화면: 010-****-1234</text>
  </g>
  <text x="48" y="384" font-size="11" fill="#991b1b">원본은 화면 노출 금지 (check.js 검사)</text>
  <line x1="157" y1="224" x2="157" y2="266" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="166" y="250" font-size="12" fill="#475569">1 : N</text>

  <!-- Report -->
  <rect x="352" y="64" width="300" height="338" rx="10" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5"/>
  <rect x="352" y="64" width="300" height="34" rx="10" fill="#dbeafe"/>
  <text x="368" y="87" font-size="15" font-weight="700" fill="#1e3a8a">접수 (localStorage 배열 원소)</text>
  <g font-size="13" fill="#334155" font-family="ui-monospace,Menlo,Consolas,monospace">
    <text x="368" y="122">id          "r-…"</text>
    <text x="368" y="146">complexId   단지 id</text>
    <text x="368" y="170">dong, ho    동·호수</text>
    <text x="368" y="194">text        한 줄 내용</text>
    <text x="368" y="218">photos[]    JPEG dataURL</text>
    <text x="368" y="242">status      처리 상태</text>
    <text x="368" y="266">createdAt   접수 시각</text>
    <text x="368" y="290">statusAt    상태 바뀐 시각</text>
    <text x="368" y="314">history[]   {status, at}</text>
  </g>
  <text x="368" y="350" font-size="11" fill="#64748b">연락처는 저장하지 않고 동·호수로 매번 조회</text>
  <text x="368" y="370" font-size="11" fill="#64748b">→ 운영 때 개인정보 보관 범위를 줄이는 설계</text>
  <line x1="282" y1="144" x2="348" y2="144" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="292" y="136" font-size="12" fill="#475569">1 : N</text>

  <!-- State machine -->
  <text x="690" y="87" font-size="15" font-weight="700" fill="#0f172a">처리 상태 (버튼 한 번에 다음 단계)</text>
  <rect x="700" y="110" width="200" height="50" rx="25" fill="#fff7ed" stroke="#c2410c"/>
  <text x="800" y="141" text-anchor="middle" font-size="15" font-weight="700" fill="#9a3412">접수</text>
  <line x1="800" y1="160" x2="800" y2="196" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="700" y="198" width="200" height="50" rx="25" fill="#eff6ff" stroke="#1d4ed8"/>
  <text x="800" y="229" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">업체 배정</text>
  <line x1="800" y1="248" x2="800" y2="284" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="700" y="286" width="200" height="50" rx="25" fill="#f0fdf4" stroke="#15803d"/>
  <text x="800" y="317" text-anchor="middle" font-size="15" font-weight="700" fill="#14532d">보수 완료</text>
  <rect x="690" y="356" width="240" height="46" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="810" y="376" text-anchor="middle" font-size="12" fill="#991b1b">완료 전 statusAt 기준 7일 이상</text>
  <text x="810" y="394" text-anchor="middle" font-size="12" fill="#991b1b">→ "⚠ 멈춤" 표시 (현장·본부 공통)</text>

  <text x="32" y="450" font-size="12" fill="#475569">입력 칸은 사진 · 동·호수 · 한 줄 세 가지뿐입니다. 나머지 필드는 모두 자동으로 채워집니다(PRD 채택 조건: 엑셀보다 입력이 많으면 안 씀).</text>
</svg>
